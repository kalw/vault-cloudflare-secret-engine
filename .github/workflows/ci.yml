name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, freebsd, openbsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/vault-cloudflare-secret-engine

  acceptance:
    name: Acceptance tests (live Cloudflare)
    runs-on: ubuntu-latest
    needs: test
    # Live-credential job: the parent Cloudflare token must not be exposed to
    # unreviewed code, so this only runs for pushes to main (post-review) or an
    # explicit manual dispatch - never for arbitrary branch pushes or fork PRs.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' 
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Acceptance tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TEST_POLICIES: ${{ secrets.CLOUDFLARE_TEST_POLICIES }}
          # Optional: enables the user-context (token_type=user) case.
          CLOUDFLARE_USER_API_TOKEN: ${{ secrets.CLOUDFLARE_USER_API_TOKEN }}
          CLOUDFLARE_USER_TEST_POLICIES: ${{ secrets.CLOUDFLARE_USER_TEST_POLICIES }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not configured; skipping live acceptance tests."
            echo "Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets to enable."
            exit 0
          fi
          VAULT_ACC=1 go test -run TestAcceptance -v -count=1
